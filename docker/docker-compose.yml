services:
  # The Hearth terminal: the bridge + the user's persistent Linux workspace.
  # The web terminal attaches to a bash shell in here. Everything the user
  # wants (LLM CLIs, APIs, languages, tools) they install inside it themselves.
  terminal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      # Auth is off by default. Uncomment all three to require a password:
      # HEARTH_REQUIRE_AUTH: "true"
      # HEARTH_PASSWORD: "change-me"
      # HEARTH_JWT_SECRET: "a-long-random-secret"
    volumes:
      # Persistent home — also holds session scrollback (~/.hearth/sessions),
      # so terminals replay after reconnect and across restarts.
      - hearth-home:/home/hearth
    restart: unless-stopped

volumes:
  hearth-home:
