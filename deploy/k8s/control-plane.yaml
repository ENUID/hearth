apiVersion: apps/v1
kind: Deployment
metadata:
  name: hearth-control-plane
  namespace: hearth
  labels: { app: hearth-control-plane }
spec:
  replicas: 1
  selector: { matchLabels: { app: hearth-control-plane } }
  template:
    metadata: { labels: { app: hearth-control-plane } }
    spec:
      serviceAccountName: hearth-control-plane
      containers:
        - name: server
          image: REPLACE_ME/hearth-server:latest
          ports: [{ containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - { name: HEARTH_PROVIDER, value: "kubernetes" }
            - { name: HEARTH_K8S_NAMESPACE, value: "hearth" }
            - { name: HEARTH_WORKSPACE_IMAGE, value: "REPLACE_ME/hearth-workspace:latest" }
            - { name: HEARTH_STATE_DIR, value: "/state" }
          envFrom:
            - secretRef: { name: hearth-secrets, optional: true }
          volumeMounts:
            - { name: state, mountPath: /state }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 3
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: hearth-state }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hearth-state
  namespace: hearth
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: hearth
  namespace: hearth
spec:
  selector: { app: hearth-control-plane }
  ports: [{ port: 80, targetPort: 3001 }]
